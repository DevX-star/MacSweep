name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh universal
      - name: Smoke test (read-only scan)
        run: build/MacSweep.app/Contents/MacOS/MacSweep --scan
      - uses: actions/upload-artifact@v4
        with:
          name: MacSweep
          path: build/MacSweep-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MacSweep-*.zip
          generate_release_notes: true
